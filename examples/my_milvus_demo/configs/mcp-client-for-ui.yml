# NAT as MCP Client - Connects to NAT MCP Server
# For UI: nat serve --config_file mcp-client-for-ui.yml --port 8000
# This config connects to the MCP server running on port 9904

function_groups:
  support_mcp_tools:
    _type: mcp_client
    server:
      transport: streamable-http
      url: "http://localhost:9904/mcp"

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 1024

workflow:
  _type: react_agent
  tool_names:
    - support_mcp_tools
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3

